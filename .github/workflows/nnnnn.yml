name: Download and Upload File

on:
  workflow_dispatch:
    inputs:
      direct_url:
        description: 'لینک مستقیم دانلود فایل'
        required: true
        type: string
      filename:
        description: 'نام فایل (اختیاری - در صورت خالی بودن از لینک استخراج می‌شود)'
        required: false
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Filename
      id: extract
      run: |
        if [ -z "${{ github.event.inputs.filename }}" ]; then
          FILENAME=$(basename "${{ github.event.inputs.direct_url }}" | sed 's/?.*//')
        else
          FILENAME="${{ github.event.inputs.filename }}"
        fi
        echo "filename=$FILENAME" >> $GITHUB_OUTPUT

    - name: Download File with wget
      run: |
        wget --tries=3 --timeout=30 --retry-connrefused \
          -O "${{ steps.extract.outputs.filename }}" \
          "${{ github.event.inputs.direct_url }}"

    - name: Upload to Repository
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "${{ steps.extract.outputs.filename }}"
        git commit -m "Upload ${{ steps.extract.outputs.filename }} via workflow" || echo "No changes to commit"
        git push
