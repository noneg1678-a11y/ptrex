name: Download from Mediafire

on:
  workflow_dispatch:
    inputs:
      mediafire_link:
        description: 'لینک مدیافایر فایل مورد نظر'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get direct download link
      id: extract
      run: |
        MEDIAFIRE_URL="${{ github.event.inputs.mediafire_link }}"
        
        # دریافت صفحه مدیافایر
        PAGE=$(curl -s "$MEDIAFIRE_URL")
        
        # استخراج لینک مستقیم دانلود
        DIRECT_URL=$(echo "$PAGE" | grep -oP 'https://download\d+\.mediafire\.com/[^"\047?]+' | head -1)
        
        if [ -z "$DIRECT_URL" ]; then
          echo "❌ لینک مستقیم پیدا نشد"
          exit 1
        fi
        
        # استخراج نام فایل
        FILENAME=$(basename "$DIRECT_URL" | sed 's/?.*//')
        
        echo "DIRECT_URL=$DIRECT_URL" >> $GITHUB_ENV
        echo "FILENAME=$FILENAME" >> $GITHUB_ENV
        
        echo "✅ لینک دانلود: $DIRECT_URL"
        echo "📁 نام فایل: $FILENAME"

    - name: Download file
      run: |
        echo "⏳ در حال دانلود فایل..."
        wget --tries=5 --retry-connrefused --timeout=30 \
          -O "$FILENAME" \
          "$DIRECT_URL"
        
