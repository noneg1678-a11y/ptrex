- name: Split and upload large file
  run: |
    # ساخت پوشه با نام بر اساس تاریخ و زمان
    FOLDER_NAME="mediafire_$(date +'%Y%m%d_%H%M%S')"
    mkdir -p "$FOLDER_NAME"
    
    FILE_SIZE=$(stat -c%s "$FILENAME")
    MAX_SIZE=$((90 * 1024 * 1024))  # 90 مگابایت
    
    if [ $FILE_SIZE -gt $MAX_SIZE ]; then
      echo "📦 فایل بزرگ است ($(du -h "$FILENAME" | cut -f1))، در حال اسپلیت کردن..."
      
      # روش صحیح: اول فایل رو زیپ کن، بعد اسپلیت کن
      zip -0 "$FILENAME.zip" "$FILENAME"
      
      # اسپلیت فایل زیپ شده به تکه‌های 90 مگ
      split -b 90m -d "$FILENAME.zip" "$FOLDER_NAME/${FILENAME}.part"
      
      # پاک کردن فایل‌های موقت
      rm "$FILENAME.zip"
      rm "$FILENAME"
      
      # تغییر نام تکه‌ها برای خوانایی بهتر
      cd "$FOLDER_NAME"
      part_num=1
      for part in ${FILENAME}.part*; do
        mv "$part" "${FILENAME}.part$(printf "%03d" $part_num)"
        ((part_num++))
      done
      
      # ایجاد فایل راهنما برای合并
      cat > "HOW_TO_MERGE.txt" << EOF
برای合并 این فایل اسپلیت شده:
1. همه فایل‌های .part*** را در یک پوشه قرار دهید
2. دستور زیر را اجرا کنید:
   cat ${FILENAME}.part* > ${FILENAME}.zip
3. سپس فایل زیپ را اکسترکت کنید:
   unzip ${FILENAME}.zip
یا مستقیماً:
   cat ${FILENAME}.part* > ${FILENAME}.zip && unzip ${FILENAME}.zip
EOF
      
      echo "✅ فایل به $(ls ${FILENAME}.part* | wc -l) تکه تقسیم شد"
      cd ..
    else
      echo "📁 فایل کوچکتر از 90 مگ، انتقال بدون اسپلیت"
      mv "$FILENAME" "$FOLDER_NAME/"
    fi
    
    git config user.name "github-actions[bot]"
    git config user.email "actions@github.com"
    
    git add "$FOLDER_NAME/"
    git commit -m "Add $FILENAME from Mediafire to $FOLDER_NAME" || echo "✅ بدون تغییر"
    
    # پوش کردن تدریجی برای فایل‌های بزرگ
    for i in {1..5}; do
      git push && break
      echo "تلاش مجدد در 5 ثانیه..."
      sleep 5
    done
    
    echo "🎉 فایل در پوشه $FOLDER_NAME آپلود شد"
    
    # نمایش راهنمای اکسترکت
    if [ $FILE_SIZE -gt $MAX_SIZE ]; then
      echo ""
      echo "🔓 دستورالعمل合并:"
      echo "   cd $FOLDER_NAME"
      echo "   cat ${FILENAME}.part* > ${FILENAME}.zip"
      echo "   unzip ${FILENAME}.zip"
    fi
