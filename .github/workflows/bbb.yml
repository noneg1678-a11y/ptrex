name: Download from Mediafire

on:
  workflow_dispatch:
    inputs:
      mediafire_link:
        description: 'لینک مدیافایر فایل مورد نظر'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get direct download link
      id: extract
      run: |
        MEDIAFIRE_URL="${{ github.event.inputs.mediafire_link }}"
        
        PAGE=$(curl -s "$MEDIAFIRE_URL")
        
        DIRECT_URL=$(echo "$PAGE" | grep -oP 'https://download\d+\.mediafire\.com/[^"'\''\?]+' | head -1)
        
        if [ -z "$DIRECT_URL" ]; then
          echo "لینک مستقیم پیدا نشد"
          exit 1
        fi
        
        FILENAME=$(basename "$DIRECT_URL" | sed 's/?.*//')
        
        echo "DIRECT_URL=$DIRECT_URL" >> $GITHUB_ENV
        echo "FILENAME=$FILENAME" >> $GITHUB_ENV
        
        echo "✅ لینک پیدا شد: $DIRECT_URL"

    - name: Download file
      run: |
        echo "در حال دانلود..."
        wget --tries=5 --retry-connrefused --timeout=60 -O "$FILENAME" "$DIRECT_URL"
        
        if [ -f "$FILENAME" ]; then
          SIZE=$(du -h "$FILENAME" | cut -f1)
          echo "✅ دانلود شد - حجم: $SIZE"
        else
          echo "❌ دانلود ناموفق"
          exit 1
        fi

    - name: Create folder and upload
      run: |
        # ساخت پوشه با نام بر اساس تاریخ و زمان
        FOLDER_NAME="mediafire_$(date +'%Y%m%d_%H%M%S')"
        mkdir -p "$FOLDER_NAME"
        
        # انتقال فایل به پوشه
        mv "$FILENAME" "$FOLDER_NAME/"
        
        git config user.name "github-actions[bot]"
        git config user.email "actions@github.com"
        
        git add "$FOLDER_NAME/"
        git commit -m "Add $FILENAME from Mediafire to $FOLDER_NAME" || echo "✅ بدون تغییر"
        git push
        
        echo "🎉 فایل در پوشه $FOLDER_NAME آپلود شد"
