name: Download and Split Large File

on:
  workflow_dispatch:
    inputs:
      mediafire_link:
        description: 'لینک مدیافایر فایل مورد نظر'
        required: true
        type: string

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get direct download link
      id: extract
      run: |
        MEDIAFIRE_URL="${{ github.event.inputs.mediafire_link }}"
        
        PAGE=$(curl -s "$MEDIAFIRE_URL")
        
        DIRECT_URL=$(echo "$PAGE" | grep -oP 'https://download\d+\.mediafire\.com/[^"'\''\?]+' | head -1)
        
        if [ -z "$DIRECT_URL" ]; then
          echo "❌ لینک مستقیم پیدا نشد"
          exit 1
        fi
        
        ORIGINAL_FILENAME=$(basename "$DIRECT_URL" | sed 's/?.*//')
        
        echo "DIRECT_URL=$DIRECT_URL" >> $GITHUB_ENV
        echo "ORIGINAL_FILENAME=$ORIGINAL_FILENAME" >> $GITHUB_ENV
        
        echo "✅ لینک پیدا شد: $DIRECT_URL"
        echo "📁 نام فایل اصلی: $ORIGINAL_FILENAME"

    - name: Download original file
      run: |
        echo "⏳ در حال دانلود فایل اصلی (حدود 467 مگابایت)..."
        wget --tries=5 --retry-connrefused --timeout=120 --progress=dot:giga -O "$ORIGINAL_FILENAME" "$DIRECT_URL"
        
        if [ -f "$ORIGINAL_FILENAME" ]; then
          SIZE=$(du -h "$ORIGINAL_FILENAME" | cut -f1)
          echo "✅ دانلود کامل شد - حجم: $SIZE"
        else
          echo "❌ دانلود ناموفق"
          exit 1
        fi

    - name: Split file into 90MB parts
      run: |
        # ساخت پوشه برای تکه‌ها
        FOLDER_NAME="split_$(date +'%Y%m%d_%H%M%S')"
        mkdir -p "$FOLDER_NAME"
        
        # نام پایه برای تکه‌ها (بدون پسوند)
        BASENAME=$(basename "$ORIGINAL_FILENAME")
        BASENAME_NO_EXT="${BASENAME%.*}"
        
        # تقسیم فایل به تکه‌های 90 مگابایتی
        echo "✂️ در حال تقسیم فایل به تکه‌های 90 مگابایتی..."
        split -b 90m "$ORIGINAL_FILENAME" "$FOLDER_NAME/${BASENAME_NO_EXT}.part."
        
        # شمارش تکه‌ها
        PART_COUNT=$(ls -1 "$FOLDER_NAME" | wc -l)
        echo "✅ فایل به $PART_COUNT تکه تقسیم شد"
        
        # ایجاد اسکریپت برای چسباندن مجدد
        cat > "$FOLDER_NAME/merge.sh" << 'EOF'
#!/bin/bash
# این اسکریپت تکه‌ها رو به هم می‌چسبونه و فایل اصلی رو بازسازی می‌کنه

# پیدا کردن همه تکه‌ها به ترتیب
cat $(ls -1 ${BASENAME_NO_EXT}.part.* | sort -V) > "$ORIGINAL_FILENAME"

echo "✅ فایل اصلی بازسازی شد: $ORIGINAL_FILENAME"
echo "📊 حجم فایل: $(du -h "$ORIGINAL_FILENAME" | cut -f1)"
EOF
        
        chmod +x "$FOLDER_NAME/merge.sh"
        
        # ذخیره نام فایل اصلی برای استفاده بعدی
        echo "ORIGINAL_FILENAME=$ORIGINAL_FILENAME" >> $GITHUB_ENV
        echo "FOLDER_NAME=$FOLDER_NAME" >> $GITHUB_ENV
        echo "BASENAME_NO_EXT=$BASENAME_NO_EXT" >> $GITHUB_ENV

    - name: Upload split parts to repository
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "actions@github.com"
        
        git add "$FOLDER_NAME/"
        git commit -m "Split $ORIGINAL_FILENAME into 90MB parts (total $(ls -1 $FOLDER_NAME/*.part.* 2>/dev/null | wc -l) parts)"
        
        git push
        
        echo "🎉 تکه‌های فایل در پوشه $FOLDER_NAME آپلود شدند"
        echo ""
        echo "📌 برای بازسازی فایل اصلی:"
        echo "   - دانلود کل پوشه $FOLDER_NAME"
        echo "   - اجرای دستور: bash $FOLDER_NAME/merge.sh"
        echo "   - یا اجرای دستور: cat $FOLDER_NAME/${BASENAME_NO_EXT}.part.* > ${BASENAME_NO_EXT}.zip"

    - name: Show summary
      run: |
        echo "══════════════════════════════════════════════════"
        echo "✅ عملیات با موفقیت انجام شد"
        echo "══════════════════════════════════════════════════"
        echo "📦 فایل اصلی: $ORIGINAL_FILENAME"
        echo "📏 حجم اصلی: $(du -h "$ORIGINAL_FILENAME" | cut -f1)"
        echo "✂️ تعداد تکه‌ها: $(ls -1 $FOLDER_NAME/*.part.* 2>/dev/null | wc -l)"
        echo "📁 پوشه تکه‌ها: $FOLDER_NAME"
        echo ""
        echo "🔧 برای بازسازی فایل اصلی بعد از دانلود:"
        echo "   cat $FOLDER_NAME/${BASENAME_NO_EXT}.part.* > $ORIGINAL_FILENAME"
        echo "══════════════════════════════════════════════════"
